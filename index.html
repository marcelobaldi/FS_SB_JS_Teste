<!DOCTYPE html><html>
    <head>
        <meta charset="UTF-8">                                                      <!-- Aceitar Caracteres Especiais   -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">      <!-- Responsivo Celular, Tablet     -->
        <title>Cadastro Despesas</title>                                            <!-- Título Aba                     -->
    </head>
    <body>
        <form id="form_usuario">
            <input id="nome"    placeholder="Nome:">    <br>
            <input id="idade"   placeholder="Idade:">
            <button type="submit">Salvar</button>
        </form>
    
        <!-- Programação:  JavaScript  -->
        <script>
            document.getElementById('form_usuario').addEventListener('submit', async (e) => {
                e.preventDefault();
                await fetch("https://sdetbdnklfulxrrltgbo.supabase.co/rest/v1/usuarios_simples", {   //SupaBase: API URL + Tabela     
                    method: "POST",                                                                  //HTTP:     Salvar
                    headers: {
                        "apikey":        "sb_publishable_mkWlKoVxlEuw0CtaQnrPiQ_0nonA5pQ",           //SupaBase: API Pública
                        "Authorization": "Bearer sb_publishable_mkWlKoVxlEuw0CtaQnrPiQ_0nonA5pQ",    //SupaBase: Bearer e ApiPublica
                        "Content-Type":  "application/json",                                         //Supabase: Dados Json
                        "Prefer":        "return=minimal"                                            //SupaBase: Evitar Erros
                    },
                    body: JSON.stringify({
                        nome:   document.getElementById('nome').value,
                        idade:  parseInt(document.getElementById('idade').value)
                    })
                });
                console.log(document.getElementById('nome').value);     //Msg:  No Console Browser (F12)
                alert(document.getElementById('nome').value);           //Msg:  Janela Pop Up
                document.getElementById('form_usuario').reset();        //Form: Limpar Campos
            });
        </script>
    </body>
</html>
